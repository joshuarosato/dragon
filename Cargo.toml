[package]
name = "dragon"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
description = "A tiny GTK4 drag-and-drop source for files"
authors = ["Joshua Rosato"]
license = "Apache-2.0"

[dependencies]
adw = { package = "libadwaita", version = "0.9.2" }
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_8"] }

[profile.release]
lto = "thin"
strip = true
